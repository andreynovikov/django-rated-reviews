# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.
#
# Each Python/Django combination is tested with and without Django REST
# framework, as REST API is an optional feature. The "docs" environment
# checks that documentation builds without warnings.

[tox]
envlist =
    py{310,311}-django52-{nodrf,drf}
    py{312,313,314}-django{52,60,61}-{nodrf,drf}
    py315-django61-{nodrf,drf}
    docs

skip_missing_interpreters = true

[testenv]
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
extras =
    drf: api
commands = {envpython} -W default::DeprecationWarning tests/runtests.py {posargs}

[testenv:docs]
base_python = py313
extras = api
deps = -r docs/requirements.txt
commands = sphinx-build -W --keep-going -b html docs {envtmpdir}/html

[gh]
python =
    3.15 = py315-django61-{nodrf,drf}
    3.14 = py314-django{52,60,61}-{nodrf,drf}
    3.13 = py313-django{52,60,61}-{nodrf,drf}, docs
    3.12 = py312-django{52,60,61}-{nodrf,drf}
    3.11 = py311-django52-{nodrf,drf}
    3.10 = py310-django52-{nodrf,drf}
