[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-rated-reviews"
version = "2.0.0"
description = "Rated reviews for Django"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Andrey Novikov", email = "novikov@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
  "Django>=5.2",
]
classifiers = [
  "Development Status :: 6 - Mature",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
api = [
  "djangorestframework>=3.16",
]

[project.urls]
Homepage = "https://github.com/andreynovikov/django-rated-reviews"
Documentation = "https://django-rated-reviews.readthedocs.io/"
Repository = "https://github.com/andreynovikov/django-rated-reviews.git"
Issues = "https://github.com/andreynovikov/django-rated-reviews/issues"
Releases = "https://github.com/andreynovikov/django-rated-reviews/releases"

[tool.setuptools.packages.find]
include = ["reviews*"]
